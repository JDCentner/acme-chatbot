services:
  app:
    build: .
    ports: ['127.0.0.1:3000:3000']
    environment:
      MODEL_MODE: ${MODEL_MODE:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-6-luna}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-gpt-6-luna}
      REVIEW_MODEL: ${REVIEW_MODEL:-gpt-6-luna}
      GRADER_MODEL: ${GRADER_MODEL:-gpt-6.1-sol}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-low}
      CLASSIFIER_REASONING_EFFORT: ${CLASSIFIER_REASONING_EFFORT:-low}
      REVIEW_REASONING_EFFORT: ${REVIEW_REASONING_EFFORT:-low}
      GRADER_REASONING_EFFORT: ${GRADER_REASONING_EFFORT:-medium}
    volumes: ['app-data:/app/data']
  results:
    build: .
    entrypoint: [pnpm, exec, promptfoo, view, --port, '15500', --no]
    ports: ['127.0.0.1:15500:15500']
    environment:
      PROMPTFOO_CONFIG_DIR: /app/eval-data
      PROMPTFOO_DISABLE_TELEMETRY: '1'
    volumes: ['eval-data:/app/eval-data']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:15500').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  evals:
    build: .
    profiles: [tools]
    depends_on:
      app:
        condition: service_healthy
    entrypoint: [pnpm, exec, promptfoo, eval, -c, evals/promptfooconfig.yaml, --no-cache]
    environment:
      APP_URL: http://app:3000
      EVAL_BATCH_ID: ${EVAL_BATCH_ID:-}
      PROMPTFOO_CONFIG_DIR: /app/eval-data
      PROMPTFOO_DISABLE_TELEMETRY: '1'
    volumes: ['eval-data:/app/eval-data']
  tests:
    build: .
    profiles: [tools]
    entrypoint: [pnpm, test]
    healthcheck:
      disable: true
volumes:
  app-data:
  eval-data:
