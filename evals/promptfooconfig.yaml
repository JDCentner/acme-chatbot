description: 'ACME: original prompt vs one agent vs Sophie with specialists. Fixture runs do not measure model quality.'
prompts:
  - '{{messages}}'
providers:
  - id: file://provider.cjs
    label: Original prompt
    config:
      variant: baseline
  - id: file://provider.cjs
    label: One agent + checks
    config:
      variant: single
  - id: file://provider.cjs
    label: Sophie + specialists
    config:
      variant: specialists
tests:
  - file://cases.yaml
  - file://generated.yaml
  - file://workflows.yaml
  - file://conversations.yaml
  - file://task-goals.yaml
evaluateOptions:
  maxConcurrency: 3
  cache: false
defaultTest:
  assert:
    - type: javascript
      metric: Answer accuracy
      value: |
        const meta = context.providerResponse.metadata;
        const grade = meta.modelGrade?.answerAccuracy;
        return {pass: meta.mode === 'live' && meta.status !== 'error' && grade?.passed === true, score: grade?.passed ? 1 : 0, reason: grade?.reasons?.join(' ') || 'Not scored: fixture mode or grader error.'};
    - type: javascript
      metric: Factual support
      value: |
        const meta = context.providerResponse.metadata;
        const grade = meta.modelGrade?.factualSupport;
        return {pass: meta.mode === 'live' && meta.status !== 'error' && grade?.passed === true, score: grade?.passed ? 1 : 0, reason: grade?.reasons?.join(' ') || 'Not scored: fixture mode or grader error.'};
