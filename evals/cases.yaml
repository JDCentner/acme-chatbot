- description: '01. Task example: Monthly price'
  metadata:
    source: task
    category: base
    caseId: T01

  vars:
    caseId: T01
    caseTitle: '01. Task example: Monthly price'
    category: base
    source: task
    messages: '["Hello, my name is James and I am looking to learn how much your community costs?"]'
    expectations: Independent Living starts at $2000 monthly. Assisted Living starts at $3000. Entrance fee $3500. No room-specific quote.
    expectedRequests: '[]'

- description: '02. Task example: Medicaid after price concern'
  metadata:
    source: task
    category: base
    caseId: T02

  vars:
    caseId: T02
    caseTitle: '02. Task example: Medicaid after price concern'
    category: base
    source: task
    messages: '["Hello, my name is James and I am looking to learn how much your community costs?", "Wow! That is really expensive. do you take Medicaid?"]'
    expectations: Acknowledge cost concern. State participation in Medicaid and HUD. Do not promise eligibility.
    expectedRequests: '[]'

- description: '03. Task example: Sunday tour'
  metadata:
    source: task
    category: base
    caseId: T03

  vars:
    caseId: T03
    caseTitle: '03. Task example: Sunday tour'
    category: base
    source: task
    messages: '["I would like to come for a tour, does next Sunday at 3pm work?"]'
    expectations: Sunday is unavailable. Explain weekday tours and ask for another time. Do not claim a booking.
    expectedRequests: '[]'

- description: '04. Task example: Short contextual tour reply'
  metadata:
    source: task
    category: base
    caseId: T04

  vars:
    caseId: T04
    caseTitle: '04. Task example: Short contextual tour reply'
    category: base
    source: task
    messages: '["I would like to come for a tour, does next Sunday at 3pm work?", "Yes, Tuesday at 2pm might work"]'
    expectations: Use context. Resolve Tuesday from the server clock. Check weekday availability. Ask for missing details without claiming a booking.
    expectedRequests: '[]'

- description: '05. Task example: Included cost and temperature controls'
  metadata:
    source: task
    category: base
    caseId: T05

  vars:
    caseId: T05
    caseTitle: '05. Task example: Included cost and temperature controls'
    category: base
    source: task
    messages: '["What is included in the monthly cost? Do the rooms have individual controlled Air Conditioning? My mom runs hot and she likes to set the temperature very low"]'
    expectations: List supplied inclusions. Air conditioning is known; individual temperature controls are unknown. Answer both topics.
    expectedRequests: '[]'

- description: '06. Task example: Room-specific price'
  metadata:
    source: task
    category: base
    caseId: T06

  vars:
    caseId: T06
    caseTitle: '06. Task example: Room-specific price'
    category: base
    source: task
    messages: '["How much for a 2 bedroom in assisted living?"]'
    expectations: Assisted Living starts at $3000. Price for a two-bedroom unit is unknown. Do not invent it.
    expectedRequests: '[]'

- description: '07. Task example: Couples and dementia'
  metadata:
    source: task
    category: base
    caseId: T07

  vars:
    caseId: T07
    caseTitle: '07. Task example: Couples and dementia'
    category: base
    source: task
    messages: '["Can my mom and dad live together in the community? Mom has Dementia, but dad wants to stay with her"]'
    expectations: Couples can live together. Dementia care suitability is unknown. Offer human contact. Do not infer memory care.
    expectedRequests: '[]'

- description: '08. Task example: Resident car'
  metadata:
    source: task
    category: base
    caseId: T08

  vars:
    caseId: T08
    caseTitle: '08. Task example: Resident car'
    category: base
    source: task
    messages: '["Can my dad bring his car?"]'
    expectations: Residents can have cars. Resident parking is available.
    expectedRequests: '[]'

- description: '09. Task example: Golden retriever'
  metadata:
    source: task
    category: base
    caseId: T09

  vars:
    caseId: T09
    caseTitle: '09. Task example: Golden retriever'
    category: base
    source: task
    messages: '["Are dogs allowed? My mom has a golden retriever she would like to bring with her"]'
    expectations: Small dogs under 25 lbs. and service animals are allowed. Do not approve a golden retriever or infer its weight. Exceptions are unknown.
    expectedRequests: '[]'

- description: '10. Task example: Kosher and low sodium'
  metadata:
    source: task
    category: base
    caseId: T10

  vars:
    caseId: T10
    caseTitle: '10. Task example: Kosher and low sodium'
    category: base
    source: task
    messages: '["Can I get Kosher and low sodium meals?"]'
    expectations: Low sugar/salt options are listed. Kosher meals are unknown. Do not imply they are available.
